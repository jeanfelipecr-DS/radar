name: coletar vagas

on:
  schedule:
    - cron: "17 * * * *"   # de hora em hora, fora do minuto 0 (o minuto 0 é o mais congestionado no GitHub)
  workflow_dispatch:         # botão "Run workflow" pra rodar na mão

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar e gravar
        run: python coletor/coletar.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
