<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar</title>
<meta name="description" content="Radar — vagas de freela ranqueadas pelo que cada um sabe entregar.">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" href="https://jeanfelipecr-ds.github.io/marca/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="https://jeanfelipecr-ds.github.io/marca/apple-touch-icon.png">
<link rel="stylesheet" href="https://jeanfelipecr-ds.github.io/marca/tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- supabase-js servido do próprio site: o Edge bloqueia o armazenamento de scripts vindos de CDN de terceiros e a sessão não se fixa -->
<script src="vendor/supabase-js-2.45.4.min.js"></script>
<style>
  :root { color-scheme: dark; --borda: rgba(237,231,218,.09); --borda2: rgba(237,231,218,.16); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; background: radial-gradient(90% 60% at 20% 0%, #15130F 0%, #0B0A09 55%, #050505 100%) fixed, #0A0A0A;
         color: var(--jfc-texto); font: 15px/1.5 var(--jfc-fonte); -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  a { color: inherit; }
  .app { max-width: 560px; margin: 0 auto; padding: 18px 16px 60px; }
  .rotulo { font-size: 10.5px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--jfc-texto-suave); }
  .traco { display: inline-block; width: 28px; height: 3px; background: var(--jfc-ouro); vertical-align: middle; margin-right: 10px; }

  /* topo */
  .topo { display: flex; align-items: center; gap: 12px; padding: 4px 0 18px; }
  .topo img { height: 34px; }
  .topo .marca b { display: block; font-weight: 600; font-size: 16px; letter-spacing: .34em; color: var(--jfc-texto-forte); }
  .topo .marca small { font-size: 11.5px; color: var(--jfc-texto-suave); }
  .topo .marca small.atrasada { color: var(--jfc-atencao); }
  .topo .acoes { margin-left: auto; display: flex; gap: 6px; }
  .topo .acoes button { font-size: 12px; color: var(--jfc-texto-suave); border: 1px solid var(--borda2); border-radius: 8px; padding: 6px 10px; }

  /* 3 números */
  .numeros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 22px; }
  .num { background: rgba(237,231,218,.03); border: 1px solid var(--borda); border-radius: 14px; padding: 12px 12px 11px; }
  .num .v { font-size: 26px; font-weight: 700; letter-spacing: -.02em; color: var(--jfc-texto-forte); line-height: 1.1; }
  .num .v.ouro { background: var(--jfc-ouro-metal); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .num .l { font-size: 11px; color: var(--jfc-texto-suave); margin-top: 4px; line-height: 1.3; }
  .num.breve .v { color: #4A453D; }
  .nota-min { font-size: 12px; color: var(--jfc-texto-suave); margin: -12px 0 18px; }

  /* blocos */
  .bloco { border: 1px solid var(--borda); border-radius: 16px; margin-bottom: 12px; background: rgba(18,17,16,.6); overflow: hidden; }
  .bloco > button { width: 100%; text-align: left; display: flex; align-items: center; gap: 12px; padding: 16px; }
  .bloco .t { flex: 1; }
  .bloco .t b { display: block; font-size: 15px; font-weight: 600; color: var(--jfc-texto-forte); letter-spacing: .04em; }
  .bloco .t span { font-size: 12px; color: var(--jfc-texto-suave); }
  .bloco .qtd { font-size: 22px; font-weight: 700; color: var(--jfc-ouro-claro); }
  .bloco .seta { color: var(--jfc-texto-suave); transition: transform .2s; }
  .bloco.aberto .seta { transform: rotate(90deg); }
  .bloco .lista { display: none; border-top: 1px solid var(--borda); }
  .bloco.aberto .lista { display: block; }
  .bloco.mercado { opacity: .78; }
  .bloco.mercado .qtd { color: var(--jfc-texto-suave); }
  .vazio { padding: 14px 16px 16px; font-size: 13px; color: var(--jfc-texto-suave); }
  .mais { width: 100%; padding: 12px 16px; font-size: 12.5px; color: var(--jfc-texto-suave); border-top: 1px solid var(--borda); text-align: left; }

  /* vaga */
  .vaga { border-top: 1px solid var(--borda); }
  .vaga:first-child { border-top: 0; }
  .vaga > button { width: 100%; text-align: left; display: flex; gap: 12px; padding: 13px 16px; align-items: flex-start; }
  .nota { flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px;
          border: 2px solid #3A342A; color: var(--jfc-texto-suave); }
  .nota.n50 { border-color: var(--jfc-ouro-medio); color: var(--jfc-ouro-claro); }
  .nota.n75 { border: 0; background: var(--jfc-ouro-metal); color: #0A0A0A; }
  .vaga .corpo { flex: 1; min-width: 0; }
  .vaga h3 { font-size: 14.5px; font-weight: 600; line-height: 1.3; color: var(--jfc-texto-forte); }
  .vaga .meta { font-size: 12.5px; color: var(--jfc-texto-suave); margin-top: 3px; }
  .vaga .meta b { color: var(--jfc-ouro-claro); font-weight: 600; }
  .etiquetas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .etq { font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--borda2); color: #CFC9BE; }
  .etq.fala { border-color: rgba(212,175,55,.45); color: var(--jfc-ouro-claro); }
  .etq.nova { background: rgba(212,175,55,.14); border-color: transparent; color: var(--jfc-ouro-claro); }
  .detalhe { display: none; padding: 0 16px 16px 70px; }
  .vaga.aberta .detalhe { display: block; }
  .detalhe .termos { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .detalhe .termos span { font-size: 11px; padding: 3px 8px; border-radius: 6px; background: rgba(212,175,55,.10); color: var(--jfc-ouro-claro); }
  .detalhe p { font-size: 13px; color: #CFC9BE; margin-bottom: 8px; white-space: pre-line; }
  .detalhe .pouco { font-size: 12px; color: var(--jfc-texto-suave); white-space: normal; }
  .botoes { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; text-decoration: none; border: 1px solid var(--borda2); }
  .btn.ouro { background: var(--jfc-ouro-metal); color: #0A0A0A; border-color: transparent; }
  .btn[disabled] { opacity: .45; cursor: default; }

  /* configurar */
  .secao { border: 1px solid var(--borda); border-radius: 16px; background: rgba(18,17,16,.6); padding: 16px; margin-bottom: 14px; }
  .secao h2 { font-size: 13px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--jfc-texto-forte); margin-bottom: 4px; }
  .secao .ajuda { font-size: 12.5px; color: var(--jfc-texto-suave); margin-bottom: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--borda2); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 13px; }
  .chip.meio { border-style: dashed; }
  .chip button { font-size: 11px; padding: 2px 7px; border-radius: 999px; color: var(--jfc-texto-suave); }
  .chip .peso { border: 1px solid var(--borda2); color: var(--jfc-ouro-claro); }
  .linha { display: flex; gap: 8px; flex-wrap: wrap; }
  .linha input, .linha select { flex: 1; min-width: 120px; background: #121110; border: 1px solid var(--borda2); border-radius: 10px; padding: 10px 12px; color: var(--jfc-texto-forte); }
  .linha select { flex: 0 0 auto; min-width: 0; }
  .msg { font-size: 12.5px; margin-top: 8px; min-height: 18px; color: var(--jfc-ouro-claro); }
  .msg.erro { color: var(--jfc-alerta); }
  .convite { margin-top: 12px; border: 1px dashed rgba(212,175,55,.5); border-radius: 12px; padding: 12px; font-size: 13px; white-space: pre-line; }
  .pessoas { margin-top: 14px; }
  .pessoa { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--borda); font-size: 13px; }
  .pessoa .q { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .pessoa .q small { display: block; color: var(--jfc-texto-suave); font-size: 11.5px; }

  /* login */
  .login { min-height: 86vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 14px; }
  .login img { height: 120px; margin-bottom: 6px; }
  .login h1 { font-size: 22px; font-weight: 600; letter-spacing: .4em; color: var(--jfc-texto-forte); padding-left: .4em; }
  .login p { color: var(--jfc-texto-suave); font-size: 14px; max-width: 30ch; }
  .login form { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; margin-top: 10px; }
  .login input { background: #121110; border: 1px solid var(--borda2); border-radius: 10px; padding: 12px 14px; color: var(--jfc-texto-forte); }
  .login .btn { padding: 12px; font-size: 14px; }
  .login .alt { font-size: 12.5px; color: var(--jfc-texto-suave); text-decoration: underline; }
  .aviso { font-size: 13px; color: var(--jfc-ouro-claro); min-height: 20px; }
  .erro { color: var(--jfc-alerta); }
  .carregando { padding: 40px 0; text-align: center; color: var(--jfc-texto-suave); }
</style>
</head>
<body>
<main class="app" id="app"><div class="carregando">Carregando…</div></main>

<script>
(function () {
/*
  Radar — vagas de freela ranqueadas pelo perfil de quem está logado (docs/SDD_multiusuario.md).
  A chave abaixo é a PÚBLICA (papel "anon"): sozinha não lê nada. As regras de acesso (RLS) só
  liberam as vagas para convidados e o perfil para o próprio dono. Por isso pode ficar no código.
*/
const SUPABASE_URL = "https://kagwnqkhatulpswqigzm.supabase.co";
const CHAVE_PUBLICA = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthZ3ducWtoYXR1bHBzd3FpZ3ptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwNTc2NTIsImV4cCI6MjA5NzYzMzY1Mn0.mz0oERNhhta2Z7d2icoNXrYsdtrZSki3CZEZu9vHc78";
const DONO = "jeanfelipecr@gmail.com";   // só ele vê "Convidar" (a função convidar confere de novo no servidor)
// Trava do login: a padrão (navigator.locks) ficava esperando para sempre e as consultas nunca voltavam.
// Com poucos usuários, rodar direto é seguro — a supabase-js já evita renovar o token duas vezes na mesma aba.
const sb = supabase.createClient(SUPABASE_URL, CHAVE_PUBLICA, { auth: { lock: async (nome, espera, fn) => await fn() } });

const PRAZOS = [
  { id: "dias",    titulo: "DIAS",    sub: "treino e avaliação de IA — sem cliente, sem proposta" },
  { id: "semanas", titulo: "SEMANAS", sub: "projeto com cliente, por proposta" },
  { id: "meses",   titulo: "MESES",   sub: "seleção pesada, paga mais", vazio: "Toptal e Arc entram como link na parte 4." },
];
const FONTE = { mercor: "Mercor", braintrust: "Braintrust", freelancer: "Freelancer" };
const UNIDADE = { hora: "/h", tarefa: "/tarefa", projeto: "/projeto", ano: "/ano" };
const app = document.getElementById("app");
const estado = { sessao: null, tela: "vagas", vagas: [], frescor: [], perfil: null, termos: [], convidados: null,
                 abertos: ler("radar_abertos", ["dias"]), mostrarTodas: {} };

function ler(chave, padrao) { try { return JSON.parse(localStorage.getItem(chave)) ?? padrao; } catch { return padrao; } }
function gravar(chave, valor) { try { localStorage.setItem(chave, JSON.stringify(valor)); } catch {} }

// Texto vindo das fontes é externo: sempre escapado antes de ir para o HTML.
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dinheiro = v => v == null ? null : "US$ " + Math.round(Number(v)).toLocaleString("pt-BR");
function valor(v) {
  const a = dinheiro(v.valor_min), b = dinheiro(v.valor_max), u = UNIDADE[v.unidade] || "";
  if (!b) return null;
  return (a && v.valor_min !== v.valor_max ? `${a}–${b.replace("US$ ", "")}` : b) + u;
}
// Mercor: o número é o TETO (paga por hora). Braintrust/Freelancer: horas ESPERADAS. (decisão de 13/10/2026)
const horas = v => !v.horas_semana ? null : v.fonte === "mercor" ? `teto ${v.horas_semana}h/sem` : `espera ${v.horas_semana}h/sem`;
function haQuanto(iso) {
  const min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (min < 60) return `há ${min} min`;
  const h = Math.round(min / 60);
  return h < 48 ? `há ${h} h` : `há ${Math.round(h / 24)} dias`;
}

/* ------------------------------------------------------------ login */
function telaLogin(msg = "", erro = false) {
  app.innerHTML = `
    <section class="login">
      <img src="https://jeanfelipecr-ds.github.io/marca/simbolo-construcao.svg" alt="">
      <h1>RADAR</h1>
      <p>Vagas de freela ranqueadas pelo que você sabe entregar.</p>
      <form id="form">
        <input type="email" id="email" placeholder="e-mail" autocomplete="email" required>
        <input type="password" id="senha" placeholder="senha" autocomplete="current-password">
        <button class="btn ouro" type="submit">Entrar</button>
        <button class="alt" type="button" id="link">prefiro receber um link no e-mail</button>
      </form>
      <div class="aviso ${erro ? "erro" : ""}" id="aviso">${esc(msg)}</div>
    </section>`;
  const aviso = document.getElementById("aviso");
  const email = () => document.getElementById("email").value.trim();
  document.getElementById("form").onsubmit = async e => {
    e.preventDefault();
    const senha = document.getElementById("senha").value;
    if (!senha) { aviso.className = "aviso erro"; aviso.textContent = "Digite a senha — ou peça o link no e-mail."; return; }
    aviso.className = "aviso"; aviso.textContent = "Entrando…";
    const { error } = await sb.auth.signInWithPassword({ email: email(), password: senha });
    if (error) { aviso.className = "aviso erro"; aviso.textContent = "E-mail ou senha não conferem."; }
  };
  document.getElementById("link").onclick = async () => {
    if (!email()) { aviso.className = "aviso erro"; aviso.textContent = "Digite o e-mail primeiro."; return; }
    aviso.className = "aviso"; aviso.textContent = "Enviando…";
    const { error } = await sb.auth.signInWithOtp({ email: email(), options: { shouldCreateUser: false, emailRedirectTo: location.origin + location.pathname } });
    if (error) { aviso.className = "aviso erro"; aviso.textContent = "Não consegui enviar: " + error.message; return; }
    aviso.textContent = "Pronto. Abre o e-mail \"Your sign-in link\" e toca no link.";
  };
}

/* ------------------------------------------------------------ dados */
async function carregar() {
  const campos = "fonte,id_externo,titulo,empresa,url,area,habilidades,tipo,prazo,valor_min,valor_max,unidade,horas_semana,entrevista_falada,aceita_brasil,publicada_em,primeira_vez_em,encaixe,termos,escondida,nova,abaixo_minimo";
  const [v, f, p, t] = await Promise.all([
    sb.from("vaga_radar").select(campos).eq("aceita_brasil", true).eq("escondida", false)
      .order("encaixe", { ascending: false }).order("valor_max", { ascending: false, nullsFirst: false }),
    sb.from("frescor_fonte").select("*"),
    sb.from("perfil").select("user_id,nome,modelo,valor_min_usd").maybeSingle(),
    sb.from("perfil_termo").select("termo,rotulo,peso,tipo").order("tipo").order("peso", { ascending: false }).order("rotulo"),
  ]);
  const erro = v.error || f.error || p.error || t.error;
  if (erro) throw erro;
  estado.vagas = v.data; estado.frescor = f.data; estado.perfil = p.data; estado.termos = t.data;
}

/* ------------------------------------------------------------ topo */
function topo() {
  const ultima = estado.frescor.map(f => f.ultima_coleta_boa).filter(Boolean).sort().pop();
  const atrasada = !ultima || (Date.now() - new Date(ultima)) > 150 * 60000 || estado.frescor.some(f => f.ultima_deu_certo === false);
  const falhas = estado.frescor.filter(f => f.ultima_deu_certo === false).map(f => FONTE[f.fonte] || f.fonte).join(", ");
  const config = estado.tela === "config";
  return `
    <header class="topo">
      <img src="https://jeanfelipecr-ds.github.io/marca/simbolo-ouro.svg" alt="">
      <div class="marca"><b>RADAR</b>
        <small class="${atrasada ? "atrasada" : ""}">${ultima ? "última busca " + haQuanto(ultima) : "sem busca ainda"}${falhas ? " · falhou: " + esc(falhas) : ""}</small></div>
      <div class="acoes">
        <button type="button" data-acao="${config ? "vagas" : "config"}">${config ? "← Vagas" : "Configurar"}</button>
        <button type="button" data-acao="sair">Sair</button>
      </div>
    </header>`;
}

/* ------------------------------------------------------------ vagas */
function linhaVaga(v) {
  const n = v.encaixe >= 75 ? "n75" : v.encaixe >= 50 ? "n50" : "";
  const partes = [valor(v) ? `<b>${esc(valor(v))}</b>` : null, horas(v), FONTE[v.fonte] || v.fonte].filter(Boolean);
  return `
    <div class="vaga" data-chave="${esc(v.fonte + ":" + v.id_externo)}">
      <button type="button" data-acao="vaga">
        <span class="nota ${n}" title="encaixe">${v.encaixe}</span>
        <span class="corpo">
          <h3>${esc(v.titulo)}</h3>
          <div class="meta">${partes.join(" · ")}</div>
          <div class="etiquetas">
            ${v.nova ? '<span class="etq nova">nova</span>' : ""}
            ${v.entrevista_falada ? '<span class="etq fala">🎙️ entrevista falada</span>' : ""}
          </div>
        </span>
      </button>
      <div class="detalhe"></div>
    </div>`;
}

function bloco(id, titulo, sub, vagas, extra = "", vazio = "Nada por enquanto.") {
  const comEncaixe = vagas.filter(v => v.encaixe > 0);
  const resto = vagas.length - comEncaixe.length;
  const mostrar = estado.mostrarTodas[id] ? vagas : comEncaixe;
  const melhor = comEncaixe.length ? comEncaixe[0].encaixe : 0;
  return `
    <section class="bloco ${extra} ${estado.abertos.includes(id) ? "aberto" : ""}" data-bloco="${id}">
      <button type="button" data-acao="bloco">
        <span class="t"><b>${titulo}</b><span>${sub}${comEncaixe.length ? ` · melhor encaixe ${melhor}` : ""}</span></span>
        <span class="qtd">${comEncaixe.length}</span><span class="seta">›</span>
      </button>
      <div class="lista">
        ${mostrar.length ? mostrar.map(linhaVaga).join("") : `<div class="vazio">${esc(vazio)}</div>`}
        ${resto && !estado.mostrarTodas[id] ? `<button class="mais" type="button" data-acao="mais">mostrar as outras ${resto} (sem encaixe com o seu perfil)</button>` : ""}
      </div>
    </section>`;
}

function telaVagas() {
  const visiveis = estado.vagas.filter(v => !v.abaixo_minimo);
  const abaixo = estado.vagas.length - visiveis.length;
  const freela = visiveis.filter(v => v.tipo === "freela");
  const integral = visiveis.filter(v => v.tipo === "integral");
  const novas = freela.filter(v => v.nova && v.encaixe >= 50).length;
  app.innerHTML = topo() + `
    <div class="numeros">
      <div class="num"><div class="v ouro">${novas}</div><div class="l">vagas novas no seu perfil (24 h)</div></div>
      <div class="num breve"><div class="v">—</div><div class="l">candidaturas em andamento · parte 3</div></div>
      <div class="num breve"><div class="v">—</div><div class="l">recebido no mês · parte 3</div></div>
    </div>
    ${abaixo ? `<p class="nota-min">${abaixo} vagas escondidas pelo seu valor mínimo de ${esc(dinheiro(estado.perfil?.valor_min_usd))}.</p>` : ""}
    <p class="rotulo" style="margin:0 0 10px"><span class="traco"></span>Freela · por tempo até o 1º dinheiro</p>
    ${PRAZOS.map(p => bloco(p.id, p.titulo, p.sub, freela.filter(v => v.prazo === p.id), "", p.vazio)).join("")}
    <p class="rotulo" style="margin:24px 0 10px"><span class="traco" style="background:#4A453D"></span>Termômetro</p>
    ${bloco("mercado", "MERCADO — TEMPO INTEGRAL", "não cabe com o horário comercial; só pra ler o mercado", integral, "mercado")}`;
}

async function abrirDetalhe(el) {
  const caixa = el.querySelector(".detalhe");
  const [fonte, id] = el.dataset.chave.split(/:(.*)/s);
  const v = estado.vagas.find(x => x.fonte === fonte && x.id_externo === id);
  caixa.innerHTML = `
    ${v.termos.length ? `<div class="termos">${v.termos.map(t => `<span>${esc(t)}</span>`).join("")}</div>` : ""}
    <p class="pouco">${[v.area, v.empresa, v.publicada_em ? "publicada em " + new Date(v.publicada_em).toLocaleDateString("pt-BR") : null].filter(Boolean).map(esc).join(" · ")}</p>
    <p class="desc">Carregando descrição…</p>
    <div class="botoes">
      <a class="btn ouro" href="${esc(v.url)}" target="_blank" rel="noopener">Abrir vaga ↗</a>
      <button class="btn" type="button" disabled title="chega na parte 3">Me candidatei</button>
    </div>`;
  // a descrição é grande: só busca quando a vaga é aberta
  const { data } = await sb.from("vaga").select("descricao").eq("fonte", fonte).eq("id_externo", id).maybeSingle();
  const texto = (data?.descricao || "").replace(/<[^>]+>/g, " ").replace(/[#*_`>]+/g, "").replace(/^\s*-\s+/gm, "• ").replace(/[ \t]+\n/g, "\n").replace(/\n{2,}/g, "\n").trim();
  caixa.querySelector(".desc").textContent = texto ? (texto.length > 700 ? texto.slice(0, 700) + "…" : texto) : "Sem descrição na fonte — abre a vaga.";
}

/* ------------------------------------------------------------ configurar */
function chipsDe(tipo) {
  const lista = estado.termos.filter(t => t.tipo === tipo);
  if (!lista.length) return `<p class="ajuda">Nenhuma ainda.</p>`;
  return `<div class="chips">${lista.map(t => `
    <span class="chip ${t.peso < 1 ? "meio" : ""}" data-termo="${esc(t.termo)}">${esc(t.rotulo)}
      ${tipo === "encaixe" ? `<button type="button" class="peso" data-acao="peso" title="peso — toque para trocar">${t.peso < 1 ? "½" : "1"}</button>` : ""}
      <button type="button" data-acao="remover" title="remover">×</button></span>`).join("")}</div>`;
}

function telaConfig() {
  const dono = estado.sessao?.user?.email === DONO;
  app.innerHTML = topo() + `
    <section class="secao">
      <h2>Minhas habilidades</h2>
      <p class="ajuda">A nota de encaixe de cada vaga sai daqui: palavra no título vale o dobro, na descrição vale metade. Peso ½ é pra o que você ainda está aprendendo. Vagas novas da Freelancer com uma palavra nova chegam na próxima busca (de hora em hora).</p>
      ${chipsDe("encaixe")}
      <form class="linha" data-form="encaixe">
        <input name="rotulo" placeholder="ex.: After Effects" required maxlength="60">
        <select name="peso"><option value="1">peso 1</option><option value="0.5">peso ½</option></select>
        <button class="btn ouro" type="submit">Adicionar</button>
      </form>
      <div class="msg" data-msg="encaixe"></div>
    </section>

    <section class="secao">
      <h2>Áreas para esconder</h2>
      <p class="ajuda">Vaga com essas palavras no título ou na área some da sua lista.</p>
      ${chipsDe("esconder")}
      <form class="linha" data-form="esconder">
        <input name="rotulo" placeholder="ex.: Medicina" required maxlength="60">
        <button class="btn" type="submit">Esconder</button>
      </form>
      <div class="msg" data-msg="esconder"></div>
    </section>

    <section class="secao">
      <h2>Valor mínimo</h2>
      <p class="ajuda">Esconde vaga que paga menos que isso — por hora ou pelo projeto inteiro, na unidade da vaga. Em branco, mostra tudo.</p>
      <form class="linha" data-form="minimo">
        <input name="minimo" type="number" min="0" step="1" inputmode="numeric" placeholder="em branco = tudo" value="${estado.perfil?.valor_min_usd ?? ""}">
        <button class="btn ouro" type="submit">Salvar (US$)</button>
      </form>
      <div class="msg" data-msg="minimo"></div>
    </section>

    <section class="secao">
      <h2>Trocar senha</h2>
      <p class="ajuda">Quem entrou com senha provisória troca aqui.</p>
      <form class="linha" data-form="senha">
        <input name="senha" type="password" autocomplete="new-password" placeholder="nova senha (8+)" minlength="8" required>
        <button class="btn" type="submit">Trocar</button>
      </form>
      <div class="msg" data-msg="senha"></div>
    </section>

    ${dono ? `
    <section class="secao">
      <h2>Convidar amigos</h2>
      <p class="ajuda">Cria o acesso com uma senha provisória pra você mandar no WhatsApp. O perfil começa pelo modelo escolhido e a pessoa edita depois.</p>
      <form class="linha" data-form="convidar">
        <input name="email" type="email" placeholder="e-mail do amigo" required>
        <select name="modelo"><option value="video">modelo Vídeo</option><option value="dados">modelo Dados</option></select>
        <button class="btn ouro" type="submit">Criar acesso</button>
      </form>
      <div class="msg" data-msg="convidar"></div>
      <div id="convite"></div>
      <div class="pessoas" id="pessoas"><p class="ajuda">Carregando convidados…</p></div>
    </section>` : ""}`;
  if (dono) listarConvidados();
}

function mensagem(nome, texto, erro = false) {
  const el = app.querySelector(`[data-msg="${nome}"]`);
  if (el) { el.className = "msg" + (erro ? " erro" : ""); el.textContent = texto; }
}

async function convidar(corpo) {
  const { data, error } = await sb.functions.invoke("convidar", { body: corpo });
  if (error) {
    let detalhe = error.message;
    try { detalhe = (await error.context.json()).erro || detalhe; } catch {}
    throw new Error(detalhe);
  }
  return data;
}

async function listarConvidados() {
  const caixa = document.getElementById("pessoas");
  try {
    const { convidados } = await convidar({ acao: "listar" });
    caixa.innerHTML = convidados.length ? convidados.map(c => `
      <div class="pessoa">
        <div class="q">${esc(c.email)}<small>modelo ${esc(c.modelo === "video" ? "Vídeo" : c.modelo === "dados" ? "Dados" : "—")} · ${c.ultimo_acesso ? "último acesso " + haQuanto(c.ultimo_acesso) : "ainda não entrou"}</small></div>
        <button class="btn" type="button" data-acao="nova_senha" data-id="${esc(c.user_id)}" data-email="${esc(c.email)}">Nova senha</button>
      </div>`).join("") : `<p class="ajuda">Ninguém convidado ainda.</p>`;
  } catch (e) { caixa.innerHTML = `<p class="ajuda erro">Não consegui listar: ${esc(e.message)}</p>`; }
}

function mostrarConvite(email, senha) {
  const texto = `Seu acesso ao Radar (vagas de freela):\nhttps://jeanfelipecr-ds.github.io/radar/\ne-mail: ${email}\nsenha provisória: ${senha}\nDepois de entrar, troque a senha em Configurar.`;
  document.getElementById("convite").innerHTML = `
    <div class="convite">${esc(texto)}</div>
    <div class="botoes"><button class="btn ouro" type="button" id="copiar">Copiar mensagem</button></div>`;
  document.getElementById("copiar").onclick = async () => {
    try { await navigator.clipboard.writeText(texto); mensagem("convidar", "Mensagem copiada — cola no WhatsApp."); }
    catch { mensagem("convidar", "Não consegui copiar sozinho: seleciona o texto acima.", true); }
  };
}

async function recarregarTermos() {
  const { data, error } = await sb.from("perfil_termo").select("termo,rotulo,peso,tipo").order("tipo").order("peso", { ascending: false }).order("rotulo");
  if (error) throw error;
  estado.termos = data;
}

/* ------------------------------------------------------------ eventos */
app.addEventListener("submit", async e => {
  const form = e.target.closest("form[data-form]"); if (!form) return;
  e.preventDefault();
  const tipo = form.dataset.form, dados = Object.fromEntries(new FormData(form));
  try {
    if (tipo === "encaixe" || tipo === "esconder") {
      const { error } = await sb.from("perfil_termo").insert({ rotulo: dados.rotulo.trim(), peso: Number(dados.peso || 1), tipo });
      if (error) throw new Error(error.code === "23505" ? "essa palavra já está na lista" : error.message);
      await recarregarTermos(); estado.precisaRecarregar = true; telaConfig();
      mensagem(tipo, `"${dados.rotulo.trim()}" adicionado.`);
    } else if (tipo === "minimo") {
      const v = dados.minimo === "" ? null : Number(dados.minimo);
      const { error } = await sb.from("perfil").update({ valor_min_usd: v }).eq("user_id", estado.sessao.user.id);
      if (error) throw error;
      estado.perfil = { ...estado.perfil, valor_min_usd: v }; estado.precisaRecarregar = true;
      mensagem("minimo", v == null ? "Sem valor mínimo: mostra tudo." : `Valor mínimo salvo: ${dinheiro(v)}.`);
    } else if (tipo === "senha") {
      const { error } = await sb.auth.updateUser({ password: dados.senha });
      if (error) throw error;
      form.reset(); mensagem("senha", "Senha trocada.");
    } else if (tipo === "convidar") {
      mensagem("convidar", "Criando…");
      const r = await convidar({ acao: "criar", email: dados.email, modelo: dados.modelo });
      form.reset(); mensagem("convidar", "Acesso criado.");
      mostrarConvite(r.email, r.senha); listarConvidados();
    }
  } catch (err) { mensagem(tipo, err.message, true); }
});

app.addEventListener("click", async e => {
  const b = e.target.closest("[data-acao]"); if (!b) return;
  const acao = b.dataset.acao;
  if (acao === "sair") { await sb.auth.signOut(); return; }   // o aviso SIGNED_OUT leva para o login
  if (acao === "config") { estado.tela = "config"; telaConfig(); window.scrollTo(0, 0); return; }
  if (acao === "vagas") {
    estado.tela = "vagas";
    if (estado.precisaRecarregar) { app.innerHTML = `<div class="carregando">Recalculando com o seu perfil…</div>`; await carregar(); estado.precisaRecarregar = false; }
    telaVagas(); window.scrollTo(0, 0); return;
  }
  if (acao === "bloco") {
    const id = b.closest(".bloco").dataset.bloco;
    estado.abertos = estado.abertos.includes(id) ? estado.abertos.filter(x => x !== id) : [...estado.abertos, id];
    gravar("radar_abertos", estado.abertos); b.closest(".bloco").classList.toggle("aberto"); return;
  }
  if (acao === "mais") { estado.mostrarTodas[b.closest(".bloco").dataset.bloco] = true; telaVagas(); return; }
  if (acao === "vaga") {
    const el = b.closest(".vaga");
    el.classList.toggle("aberta");
    if (el.classList.contains("aberta") && !el.querySelector(".detalhe").innerHTML) abrirDetalhe(el);
    return;
  }
  if (acao === "peso" || acao === "remover") {
    const termo = b.closest("[data-termo]").dataset.termo;
    const t = estado.termos.find(x => x.termo === termo);
    const q = acao === "remover" ? sb.from("perfil_termo").delete().eq("termo", termo)
                                 : sb.from("perfil_termo").update({ peso: t.peso < 1 ? 1 : 0.5 }).eq("termo", termo);
    const { error } = await q;
    if (error) { mensagem(t.tipo, error.message, true); return; }
    await recarregarTermos(); estado.precisaRecarregar = true; telaConfig(); return;
  }
  if (acao === "nova_senha") {
    if (!confirm(`Gerar uma senha nova para ${b.dataset.email}? A antiga deixa de funcionar.`)) return;
    try { const r = await convidar({ acao: "nova_senha", user_id: b.dataset.id }); mostrarConvite(r.email, r.senha); mensagem("convidar", "Senha nova gerada."); }
    catch (err) { mensagem("convidar", err.message, true); }
  }
});

/*
  Sessão: tudo parte do aviso onAuthStateChange, que já entrega a sessão.
  Armadilha da supabase-js: chamar funções do auth (ex.: pegar a sessão) de dentro desse aviso
  trava a fila interna do login — a página ficava parada em "Carregando…" depois do link do e-mail.
  Por isso: a sessão vem do próprio aviso, e o trabalho sai dele via setTimeout(…, 0).
*/
let sessaoCarregada = null;
async function aoMudarSessao(evento, sessao) {
  estado.sessao = sessao;
  if (!sessao) { sessaoCarregada = null; estado.tela = "vagas"; telaLogin(); return; }
  if (sessaoCarregada === sessao.user.id) return;        // SIGNED_IN e INITIAL_SESSION chegam juntos: carrega uma vez
  sessaoCarregada = sessao.user.id;
  try { await carregar(); estado.tela === "config" ? telaConfig() : telaVagas(); }
  catch (err) { sessaoCarregada = null; app.innerHTML = `<div class="carregando erro">Não consegui ler as vagas: ${esc(err.message)}</div>`; }
}
sb.auth.onAuthStateChange((evento, sessao) => { setTimeout(() => aoMudarSessao(evento, sessao), 0); });
})();
</script>
</body>
</html>
