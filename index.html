<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar</title>
<meta name="description" content="Radar — vagas de freela de dados, ranqueadas pelo que eu sei entregar.">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" href="https://jeanfelipecr-ds.github.io/marca/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="https://jeanfelipecr-ds.github.io/marca/apple-touch-icon.png">
<link rel="stylesheet" href="https://jeanfelipecr-ds.github.io/marca/tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- supabase-js servido do próprio site: o Edge bloqueia o armazenamento de scripts vindos de CDN de terceiros e a sessão não se fixa -->
<script src="vendor/supabase-js-2.45.4.min.js"></script>
<style>
  :root { color-scheme: dark; --borda: rgba(237,231,218,.09); --borda2: rgba(237,231,218,.16); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; background: radial-gradient(90% 60% at 20% 0%, #15130F 0%, #0B0A09 55%, #050505 100%) fixed, #0A0A0A;
         color: var(--jfc-texto); font: 15px/1.5 var(--jfc-fonte); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; }
  .app { max-width: 560px; margin: 0 auto; padding: 18px 16px 60px; }
  .rotulo { font-size: 10.5px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--jfc-texto-suave); }
  .traco { display: inline-block; width: 28px; height: 3px; background: var(--jfc-ouro); vertical-align: middle; margin-right: 10px; }

  /* topo */
  .topo { display: flex; align-items: center; gap: 12px; padding: 4px 0 18px; }
  .topo img { height: 34px; }
  .topo .marca b { display: block; font-weight: 600; font-size: 16px; letter-spacing: .34em; color: var(--jfc-texto-forte); }
  .topo .marca small { font-size: 11.5px; color: var(--jfc-texto-suave); }
  .topo .marca small.atrasada { color: var(--jfc-atencao); }
  .topo .sair { margin-left: auto; font-size: 12px; color: var(--jfc-texto-suave); border: 1px solid var(--borda2); border-radius: 8px; padding: 6px 10px; }

  /* 3 números */
  .numeros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 22px; }
  .num { background: rgba(237,231,218,.03); border: 1px solid var(--borda); border-radius: 14px; padding: 12px 12px 11px; }
  .num .v { font-size: 26px; font-weight: 700; letter-spacing: -.02em; color: var(--jfc-texto-forte); line-height: 1.1; }
  .num .v.ouro { background: var(--jfc-ouro-metal); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .num .l { font-size: 11px; color: var(--jfc-texto-suave); margin-top: 4px; line-height: 1.3; }
  .num.breve .v { color: #4A453D; }

  /* blocos */
  .bloco { border: 1px solid var(--borda); border-radius: 16px; margin-bottom: 12px; background: rgba(18,17,16,.6); overflow: hidden; }
  .bloco > button { width: 100%; text-align: left; display: flex; align-items: center; gap: 12px; padding: 16px; }
  .bloco .t { flex: 1; }
  .bloco .t b { display: block; font-size: 15px; font-weight: 600; color: var(--jfc-texto-forte); letter-spacing: .04em; }
  .bloco .t span { font-size: 12px; color: var(--jfc-texto-suave); }
  .bloco .qtd { font-size: 22px; font-weight: 700; color: var(--jfc-ouro-claro); }
  .bloco .seta { color: var(--jfc-texto-suave); transition: transform .2s; }
  .bloco.aberto .seta { transform: rotate(90deg); }
  .bloco .lista { display: none; border-top: 1px solid var(--borda); }
  .bloco.aberto .lista { display: block; }
  .bloco.mercado { opacity: .78; }
  .bloco.mercado .qtd { color: var(--jfc-texto-suave); }
  .vazio { padding: 14px 16px 16px; font-size: 13px; color: var(--jfc-texto-suave); }
  .mais { width: 100%; padding: 12px 16px; font-size: 12.5px; color: var(--jfc-texto-suave); border-top: 1px solid var(--borda); text-align: left; }

  /* vaga */
  .vaga { border-top: 1px solid var(--borda); }
  .vaga:first-child { border-top: 0; }
  .vaga > button { width: 100%; text-align: left; display: flex; gap: 12px; padding: 13px 16px; align-items: flex-start; }
  .nota { flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px;
          border: 2px solid #3A342A; color: var(--jfc-texto-suave); }
  .nota.n50 { border-color: var(--jfc-ouro-medio); color: var(--jfc-ouro-claro); }
  .nota.n75 { border: 0; background: var(--jfc-ouro-metal); color: #0A0A0A; }
  .vaga .corpo { flex: 1; min-width: 0; }
  .vaga h3 { font-size: 14.5px; font-weight: 600; line-height: 1.3; color: var(--jfc-texto-forte); }
  .vaga .meta { font-size: 12.5px; color: var(--jfc-texto-suave); margin-top: 3px; }
  .vaga .meta b { color: var(--jfc-ouro-claro); font-weight: 600; }
  .etiquetas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .etq { font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--borda2); color: #CFC9BE; }
  .etq.fala { border-color: rgba(212,175,55,.45); color: var(--jfc-ouro-claro); }
  .etq.nova { background: rgba(212,175,55,.14); border-color: transparent; color: var(--jfc-ouro-claro); }
  .detalhe { display: none; padding: 0 16px 16px 70px; }
  .vaga.aberta .detalhe { display: block; }
  .detalhe .termos { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .detalhe .termos span { font-size: 11px; padding: 3px 8px; border-radius: 6px; background: rgba(212,175,55,.10); color: var(--jfc-ouro-claro); }
  .detalhe p { font-size: 13px; color: #CFC9BE; margin-bottom: 8px; }
  .detalhe .pouco { font-size: 12px; color: var(--jfc-texto-suave); }
  .botoes { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; text-decoration: none; border: 1px solid var(--borda2); }
  .btn.ouro { background: var(--jfc-ouro-metal); color: #0A0A0A; border-color: transparent; }
  .btn[disabled] { opacity: .45; cursor: default; }

  /* login */
  .login { min-height: 86vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 14px; }
  .login img { height: 120px; margin-bottom: 6px; }
  .login h1 { font-size: 22px; font-weight: 600; letter-spacing: .4em; color: var(--jfc-texto-forte); padding-left: .4em; }
  .login p { color: var(--jfc-texto-suave); font-size: 14px; max-width: 30ch; }
  .login form { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; margin-top: 10px; }
  .login input { background: #121110; border: 1px solid var(--borda2); border-radius: 10px; padding: 12px 14px; color: var(--jfc-texto-forte); font: inherit; }
  .login .btn { justify-content: center; padding: 12px; font-size: 14px; }
  .aviso { font-size: 13px; color: var(--jfc-ouro-claro); min-height: 20px; }
  .erro { color: var(--jfc-alerta); }
  .carregando { padding: 40px 0; text-align: center; color: var(--jfc-texto-suave); }
</style>
</head>
<body>
<main class="app" id="app"><div class="carregando">Carregando…</div></main>

<script>
/*
  Radar — tela das vagas (parte 2).
  Lê a visão vaga_radar (vagas abertas já com a nota de encaixe calculada no banco) e frescor_fonte.
  A chave abaixo é a pública (papel "anon"): ela não lê nada sozinha — a regra de acesso (RLS)
  só libera os dados para o login do Jean. Por isso pode ficar no código.
*/
const SUPABASE_URL = "https://kagwnqkhatulpswqigzm.supabase.co";
const CHAVE_PUBLICA = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthZ3ducWtoYXR1bHBzd3FpZ3ptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwNTc2NTIsImV4cCI6MjA5NzYzMzY1Mn0.mz0oERNhhta2Z7d2icoNXrYsdtrZSki3CZEZu9vHc78";
// Trava do login: a padrão (navigator.locks) ficava esperando para sempre e as consultas nunca voltavam.
// Com um usuário só, rodar direto é seguro — a supabase-js já evita renovar o token duas vezes na mesma aba.
const sb = supabase.createClient(SUPABASE_URL, CHAVE_PUBLICA, { auth: { lock: async (nome, espera, fn) => await fn() } });

const PRAZOS = [
  { id: "dias",    titulo: "DIAS",    sub: "treino e avaliação de IA — sem cliente, sem proposta" },
  { id: "semanas", titulo: "SEMANAS", sub: "projeto com cliente" },
  { id: "meses",   titulo: "MESES",   sub: "seleção pesada, paga mais", vazio: "Toptal e Arc entram como link na parte 4." },
];
const UNIDADE = { hora: "/h", tarefa: "/tarefa", projeto: "/projeto", ano: "/ano" };
const app = document.getElementById("app");
const estado = { vagas: [], frescor: [], abertos: lerAbertos(), mostrarTodas: {} };

function lerAbertos() { try { return JSON.parse(localStorage.getItem("radar_abertos") || '["dias"]'); } catch { return ["dias"]; } }
function salvarAbertos() { try { localStorage.setItem("radar_abertos", JSON.stringify(estado.abertos)); } catch {} }

// Texto vindo das fontes é externo: sempre escapado antes de ir para o HTML.
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dinheiro = v => v == null ? null : "US$ " + Math.round(Number(v)).toLocaleString("pt-BR");
function valor(v) {
  const a = dinheiro(v.valor_min), b = dinheiro(v.valor_max), u = UNIDADE[v.unidade] || "";
  if (!b) return null;
  return (a && v.valor_min !== v.valor_max ? `${a}–${b.replace("US$ ", "")}` : b) + u;
}
function haQuanto(iso) {
  const min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (min < 60) return `há ${min} min`;
  const h = Math.round(min / 60);
  return h < 48 ? `há ${h} h` : `há ${Math.round(h / 24)} dias`;
}

/* ------------------------------------------------------------ login */
function telaLogin(msg = "", erro = false) {
  app.innerHTML = `
    <section class="login">
      <img src="https://jeanfelipecr-ds.github.io/marca/simbolo-construcao.svg" alt="">
      <h1>RADAR</h1>
      <p>Vagas de dados para o excedente, ranqueadas pelo que eu sei entregar.</p>
      <form id="form">
        <input type="email" id="email" placeholder="seu e-mail" autocomplete="email" required>
        <button class="btn ouro" type="submit">Receber link de acesso</button>
      </form>
      <div class="aviso ${erro ? "erro" : ""}" id="aviso">${esc(msg)}</div>
    </section>`;
  document.getElementById("form").onsubmit = async e => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const aviso = document.getElementById("aviso");
    aviso.className = "aviso"; aviso.textContent = "Enviando…";
    const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false, emailRedirectTo: location.origin + location.pathname } });
    if (error) { aviso.className = "aviso erro"; aviso.textContent = "Não consegui enviar: " + error.message; return; }
    aviso.textContent = "Pronto. Abre o e-mail \"Your sign-in link\" e toca no link.";
  };
}

/* ------------------------------------------------------------ dados */
async function carregar() {
  const campos = "fonte,id_externo,titulo,empresa,url,area,habilidades,tipo,prazo,valor_min,valor_max,unidade,horas_semana,entrevista_falada,aceita_brasil,publicada_em,primeira_vez_em,encaixe,termos,escondida,nova";
  const [v, f] = await Promise.all([
    sb.from("vaga_radar").select(campos).eq("aceita_brasil", true).eq("escondida", false)
      .order("encaixe", { ascending: false }).order("valor_max", { ascending: false, nullsFirst: false }),
    sb.from("frescor_fonte").select("*"),
  ]);
  if (v.error || f.error) throw (v.error || f.error);
  estado.vagas = v.data; estado.frescor = f.data;
}

/* ------------------------------------------------------------ tela */
function linhaVaga(v) {
  const n = v.encaixe >= 75 ? "n75" : v.encaixe >= 50 ? "n50" : "";
  const partes = [valor(v) ? `<b>${esc(valor(v))}</b>` : null, v.horas_semana ? `até ${v.horas_semana}h/sem` : null, v.fonte === "mercor" ? "Mercor" : "Braintrust"].filter(Boolean);
  return `
    <div class="vaga" data-chave="${esc(v.fonte + ":" + v.id_externo)}">
      <button type="button" data-acao="vaga">
        <span class="nota ${n}" title="encaixe">${v.encaixe}</span>
        <span class="corpo">
          <h3>${esc(v.titulo)}</h3>
          <div class="meta">${partes.join(" · ")}</div>
          <div class="etiquetas">
            ${v.nova ? '<span class="etq nova">nova</span>' : ""}
            ${v.entrevista_falada ? '<span class="etq fala">🎙️ entrevista falada</span>' : ""}
          </div>
        </span>
      </button>
      <div class="detalhe"></div>
    </div>`;
}

function bloco(id, titulo, sub, vagas, extra = "", vazio = "Nada por enquanto.") {
  const comEncaixe = vagas.filter(v => v.encaixe > 0);
  const resto = vagas.length - comEncaixe.length;
  const mostrar = estado.mostrarTodas[id] ? vagas : comEncaixe;
  const melhor = comEncaixe.length ? comEncaixe[0].encaixe : 0;
  const aberto = estado.abertos.includes(id);
  return `
    <section class="bloco ${extra} ${aberto ? "aberto" : ""}" data-bloco="${id}">
      <button type="button" data-acao="bloco">
        <span class="t"><b>${titulo}</b><span>${sub}${comEncaixe.length ? ` · melhor encaixe ${melhor}` : ""}</span></span>
        <span class="qtd">${comEncaixe.length}</span><span class="seta">›</span>
      </button>
      <div class="lista">
        ${mostrar.length ? mostrar.map(linhaVaga).join("") : `<div class="vazio">${esc(vazio)}</div>`}
        ${resto && !estado.mostrarTodas[id] ? `<button class="mais" type="button" data-acao="mais">mostrar as outras ${resto} (sem encaixe com a minha stack)</button>` : ""}
      </div>
    </section>`;
}

function render() {
  const freela = estado.vagas.filter(v => v.tipo === "freela");
  const integral = estado.vagas.filter(v => v.tipo === "integral");
  const novas = freela.filter(v => v.nova && v.encaixe >= 50).length;
  const ultima = estado.frescor.map(f => f.ultima_coleta_boa).filter(Boolean).sort().pop();
  const atrasada = !ultima || (Date.now() - new Date(ultima)) > 150 * 60000 || estado.frescor.some(f => f.ultima_deu_certo === false);
  const falhas = estado.frescor.filter(f => f.ultima_deu_certo === false).map(f => f.fonte).join(", ");
  app.innerHTML = `
    <header class="topo">
      <img src="https://jeanfelipecr-ds.github.io/marca/simbolo-ouro.svg" alt="">
      <div class="marca"><b>RADAR</b>
        <small class="${atrasada ? "atrasada" : ""}">${ultima ? "última busca " + haQuanto(ultima) : "sem busca ainda"}${falhas ? " · falhou: " + esc(falhas) : ""}</small></div>
      <button class="sair" type="button" data-acao="sair">Sair</button>
    </header>
    <div class="numeros">
      <div class="num"><div class="v ouro">${novas}</div><div class="l">vagas novas no meu perfil (24 h)</div></div>
      <div class="num breve"><div class="v">—</div><div class="l">candidaturas em andamento · parte 3</div></div>
      <div class="num breve"><div class="v">—</div><div class="l">recebido no mês · parte 3</div></div>
    </div>
    <p class="rotulo" style="margin:0 0 10px"><span class="traco"></span>Freela · por tempo até o 1º dinheiro</p>
    ${PRAZOS.map(p => bloco(p.id, p.titulo, p.sub, freela.filter(v => v.prazo === p.id), "", p.vazio)).join("")}
    <p class="rotulo" style="margin:24px 0 10px"><span class="traco" style="background:#4A453D"></span>Termômetro</p>
    ${bloco("mercado", "MERCADO — TEMPO INTEGRAL", "não cabe com o horário comercial; só pra ler o mercado", integral, "mercado")}`;
}

async function abrirDetalhe(el) {
  const caixa = el.querySelector(".detalhe");
  const [fonte, id] = el.dataset.chave.split(/:(.*)/s);
  const v = estado.vagas.find(x => x.fonte === fonte && x.id_externo === id);
  caixa.innerHTML = `
    ${v.termos.length ? `<div class="termos">${v.termos.map(t => `<span>${esc(t)}</span>`).join("")}</div>` : ""}
    <p class="pouco">${[v.area, v.empresa, v.publicada_em ? "publicada em " + new Date(v.publicada_em).toLocaleDateString("pt-BR") : null].filter(Boolean).map(esc).join(" · ")}</p>
    <p class="desc">Carregando descrição…</p>
    <div class="botoes">
      <a class="btn ouro" href="${esc(v.url)}" target="_blank" rel="noopener">Abrir vaga ↗</a>
      <button class="btn" type="button" disabled title="chega na parte 3">Me candidatei</button>
    </div>`;
  // a descrição é grande: só busca quando a vaga é aberta
  const { data } = await sb.from("vaga").select("descricao").eq("fonte", fonte).eq("id_externo", id).maybeSingle();
  const texto = (data?.descricao || "").replace(/[#*_`>]+/g, "").replace(/^\s*-\s+/gm, "• ").replace(/\s+\n/g, "\n").replace(/\n{2,}/g, "\n").trim();
  caixa.querySelector(".desc").textContent = texto ? (texto.length > 700 ? texto.slice(0, 700) + "…" : texto) : "Sem descrição na fonte — abre a vaga.";
}

app.addEventListener("click", async e => {
  const b = e.target.closest("[data-acao]"); if (!b) return;
  const acao = b.dataset.acao;
  if (acao === "sair") { await sb.auth.signOut(); return; }   // o aviso SIGNED_OUT leva para o login
  if (acao === "bloco") {
    const id = b.closest(".bloco").dataset.bloco;
    estado.abertos = estado.abertos.includes(id) ? estado.abertos.filter(x => x !== id) : [...estado.abertos, id];
    salvarAbertos(); b.closest(".bloco").classList.toggle("aberto"); return;
  }
  if (acao === "mais") { estado.mostrarTodas[b.closest(".bloco").dataset.bloco] = true; render(); return; }
  if (acao === "vaga") {
    const el = b.closest(".vaga");
    el.classList.toggle("aberta");
    if (el.classList.contains("aberta") && !el.querySelector(".detalhe").innerHTML) abrirDetalhe(el);
  }
});

/*
  Sessão: tudo parte do aviso onAuthStateChange, que já entrega a sessão.
  Armadilha da supabase-js: chamar funções do auth (ex.: pegar a sessão) de dentro desse aviso
  trava a fila interna do login — a página ficava parada em "Carregando…" depois do link do e-mail.
  Por isso: a sessão vem do próprio aviso, e o trabalho sai dele via setTimeout(…, 0).
*/
let sessaoCarregada = null;
async function aoMudarSessao(evento, sessao) {
  if (!sessao) { sessaoCarregada = null; telaLogin(); return; }
  if (sessaoCarregada === sessao.user.id) return;        // SIGNED_IN e INITIAL_SESSION chegam juntos: carrega uma vez
  sessaoCarregada = sessao.user.id;
  try { await carregar(); render(); }
  catch (err) { sessaoCarregada = null; app.innerHTML = `<div class="carregando erro">Não consegui ler as vagas: ${esc(err.message)}</div>`; }
}
sb.auth.onAuthStateChange((evento, sessao) => { setTimeout(() => aoMudarSessao(evento, sessao), 0); });
</script>
</body>
</html>
